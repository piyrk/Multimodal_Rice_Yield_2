version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: climaterice_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./experiments:/app/experiments
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climaterice_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
